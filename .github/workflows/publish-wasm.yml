# Builds the Browser App (apps/browser) for the web (WebGL vello_hybrid
# renderer) and uploads it as the `blitz-wasm-demo` artifact. The latest
# successful run of this workflow on a push to main is the published build:
# blitz-website fetches its artifact through the GitHub API, as it does for the
# Publish Browser downloads.
#
# The artifact is a static site with relative URLs: index.html plus assets/
# (the wasm, its JS glue, and the browser's stylesheets and icons). Open
# index.html?url=<page> to start on a page. Pages are fetched from the visitor's
# browser, so only sites that allow cross-origin requests (CORS) load.
name: Publish Wasm Demo
on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - .github/workflows/publish-wasm.yml
  workflow_dispatch:

jobs:
  build-wasm-demo:
    name: Build wasm demo
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.1"
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # dx fetches the wasm-bindgen CLI matching Cargo.lock
      - name: Install Dioxus CLI
        uses: taiki-e/install-action@v2
        with:
          tool: dioxus-cli@0.8.0-alpha.3

      - name: Build browser
        run: |
          dx build --platform web --package browser --release --locked --no-default-features --features web-defaults
          cp -r target/dx/blitz/release/web/public wasm-demo
          # dx writes root-relative asset URLs (in index.html and the JS that
          # loads the wasm); make them relative so the demo can be served from
          # any path
          sed -i 's#"/\./assets/#"./assets/#g' wasm-demo/index.html wasm-demo/assets/*.js
          if grep -n '"/\./assets/' wasm-demo/index.html wasm-demo/assets/*.js; then exit 1; fi
          ls -lR wasm-demo

      - name: Upload wasm demo
        uses: actions/upload-artifact@v7
        with:
          name: blitz-wasm-demo
          path: wasm-demo
          if-no-files-found: error
